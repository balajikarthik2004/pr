name: CI

on:
  # Gate 1: feature/* -> test   (the real gate - every change passes here)
  # Gate 2: test -> main        (re-runs on the combined branch before release)
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test + coverage gate
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Portable: works on any repo, public or private, no GHAS needed.
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: SAST (semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/typescript
            p/secrets
            p/owasp-top-ten

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # GHAS-only. Set repo variable HAS_ADVANCED_SECURITY=true to enable
      # (org repos on Enterprise, or any public repo).
      - name: Dependency review
        if: github.event_name == 'pull_request' && vars.HAS_ADVANCED_SECURITY == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
