name: CodeQL

# CodeQL requires GitHub Advanced Security on PRIVATE repos.
# It is free on public repos. Enable by setting the repository variable
# HAS_ADVANCED_SECURITY=true  (Settings > Secrets and variables > Actions > Variables).
# Until then this workflow runs a no-op so the required check still reports green.

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Skip notice
        if: vars.HAS_ADVANCED_SECURITY != 'true'
        run: |
          echo "::notice::CodeQL skipped - HAS_ADVANCED_SECURITY is not 'true'."
          echo "Enable Advanced Security (or make the repo public) then set the variable."

      - uses: actions/checkout@v4
        if: vars.HAS_ADVANCED_SECURITY == 'true'

      - uses: github/codeql-action/init@v3
        if: vars.HAS_ADVANCED_SECURITY == 'true'
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        if: vars.HAS_ADVANCED_SECURITY == 'true'
        with:
          category: /language:javascript-typescript
