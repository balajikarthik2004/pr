name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

# One review per PR at a time; a new push cancels the in-flight review
# so you are not billed for a review of code that no longer exists.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: ai-review
    # Advisory only: do NOT add this job to required status checks.
    # Skip drafts, bots, and fork PRs (forks cannot read secrets on
    # `pull_request`, so the job would fail with an empty API key).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}.

            Start by running `gh pr diff ${{ github.event.pull_request.number }}`
            to get the changed lines. Read surrounding files with Read/Grep only
            where you need context to judge a change.

            Comment ONLY on lines this PR changed. Never comment on untouched code.

            Review in this priority order:

            1. CORRECTNESS BUGS
               Off-by-one, null/undefined dereference, unhandled promise
               rejection, wrong async ordering, incorrect error handling,
               swallowed exceptions, broken edge cases (empty input, zero,
               negative, very large, unicode), state mutated during iteration,
               wrong comparison operator, missing await.

            2. SECURITY
               Injection (SQL/command/template), missing authz check, unsafe
               deserialization, secrets or tokens committed, SSRF, path
               traversal, unvalidated request-derived input reaching a sink,
               weak crypto, timing-unsafe comparison of secrets.

            3. PERFORMANCE
               N+1 queries, network or filesystem calls inside a loop,
               synchronous I/O on a hot path, unbounded memory growth,
               accidental O(n^2), missing pagination.

            4. QUALITY
               Only where it materially harms maintainability: duplicated
               logic that will drift, a public API that is easy to misuse,
               a missing test for a newly added branch.

            HARD RULES
            - Formatting, import order, naming and style are owned by ESLint.
              Say nothing about them.
            - Do not describe what the code does. Only flag problems.
            - Every claim needs a concrete failure: the input or sequence that
              breaks it, and the resulting wrong behaviour. If you cannot write
              that sentence, drop the finding.
            - Skip anything you are less than 80% confident is a real defect.
            - Maximum 10 inline comments. If you find more, keep the 10 worst.
            - Prefix each inline comment with a severity tag:
              [blocking], [should-fix], or [nit].
            - Finish with exactly one summary comment containing: a one-line
              verdict, a tally of findings by severity, and anything you
              deliberately did not review (e.g. generated files).
            - If the PR is clean, post no inline comments and a single
              summary comment saying so in one line.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
            --model claude-opus-5
            --max-turns 40
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note for fork PRs
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Fork PR - AI review skipped by design."
