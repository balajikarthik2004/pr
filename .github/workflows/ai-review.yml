name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    # A docs-only PR has nothing for a code reviewer to find.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# One review per PR at a time; a new push cancels the in-flight review
# so no quota is spent reviewing code that no longer exists.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: ai-review
    # Advisory only: do NOT add this job to required status checks.
    # Skipped for:
    #   - drafts
    #   - fork PRs (forks cannot read secrets on `pull_request`)
    #   - dependency bots
    #   - promotion PRs (dev -> test, test -> main): every change in them was
    #     already reviewed on its way into dev, so a second pass only burns quota
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      !(github.base_ref == 'test' && github.head_ref == 'dev') &&
      !(github.base_ref == 'main' && github.head_ref == 'test')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth - no API key, no extra billing. Generate with
          # `claude setup-token` (Pro / Max / Team / Enterprise), then:
          #   gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo balajikarthik2004/pr
          # Reviews draw on that account's normal Claude usage.
          #
          # With a pay-as-you-go API key instead, swap this line for:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }}
            in ${{ github.repository }}.

            1. Read `.github/review-guide.md`. It is the review policy: what to
               look for, in what priority order, and the hard rules. Follow it.
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the
               changed lines. Skip lockfiles, snapshots, generated files and
               anything under dist/ or coverage/.
            3. Read surrounding code with Read/Grep only where you need context
               to judge a specific change. Do not explore the repo broadly.

            Output rules:
            - Comment ONLY on lines this PR changed.
            - Skip anything you are less than 80% confident is a real defect.
            - Maximum 10 inline comments. If you find more, keep the 10 worst.
            - Prefix each inline comment with a severity tag:
              [blocking], [should-fix], or [nit].
            - Finish with exactly one summary comment (`gh pr comment`)
              containing: a one-line verdict, a tally of findings by severity,
              and anything you deliberately did not review.
            - If the PR is clean, post no inline comments and a single one-line
              summary comment saying so.
          # Sonnet keeps review cost well below Opus. For deeper reviews on
          # high-risk PRs, switch to --model claude-opus-5-5.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
            --model claude-sonnet-5
            --max-turns 25
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
