# Gemini Code Assist - disabled.
# Schema: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
#
# The AI reviewer is now Claude (.github/workflows/ai-review.yml). This file
# stays only so that, while the Gemini app is still installed on the repo, it
# does not post a second review on every PR. Once the app is uninstalled
# (GitHub > Settings > GitHub Apps), this directory can be deleted.

code_review:
  disable: true
